<!doctype html>
<html lang="pt">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>João Gonçalves | Administrador de Sistemas Júnior</title>
    <meta name="description" content="Administrador de sistemas júnior em Viana do Castelo. Junior systems administrator in Viana do Castelo, Portugal.">
    <link rel="alternate" hreflang="pt" href="pt/index.html">
    <link rel="alternate" hreflang="en" href="en/index.html">
    <link rel="alternate" hreflang="x-default" href="pt/index.html">
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/style.css">
    <script>
      // Entrada do site: abre na última língua escolhida ou na língua do browser.
      (() => {
        let lang = null;
        try {
          lang = localStorage.getItem("lang");
        } catch {}
        if (lang !== "pt" && lang !== "en") {
          const browser = (navigator.language || "").toLowerCase();
          lang = browser === "" || browser.startsWith("pt") ? "pt" : "en";
        }
        location.replace(`${lang}/index.html${location.hash}`);
      })();
    </script>
  </head>
  <body>
    <main class="container not-found">
      <p class="eyebrow">João Gonçalves</p>
      <div class="button-row">
        <a class="button button--primary" href="pt/index.html">Português</a>
        <a class="button button--secondary" href="en/index.html" lang="en">English</a>
      </div>
    </main>
  </body>
</html>
